# Fails a PR that pins a model the mirror does not serve yet. Without it the
# gap surfaces later, in a production image build, far from the change that
# caused it.
#
# The mirror is served publicly, so this needs no credentials: it is a HEAD per
# pinned file against the same origin an image build would use.
name: Mirror check

on:
  pull_request:
    paths:
      - "models/**"
      - ".github/workflows/mirror-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Mirror serves every pinned file
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Check the mirror
        env:
          ORIGIN: ${{ vars.MODELS_ORIGIN }}
        run: |
          if [ -z "$ORIGIN" ]; then
            echo "::warning::MODELS_ORIGIN is not set, so there is no mirror to check."
            exit 0
          fi
          # The downloader trims these itself, so an origin that works there has
          # to work here: a trailing slash asks S3 for a key starting with one.
          ORIGIN="${ORIGIN%"${ORIGIN##*[!/]}"}"

          alcatraz="$RUNNER_TEMP/alcatraz"
          go build -o "$alcatraz" ./cmd/alcatraz

          missing=0
          for model in $("$alcatraz" models pins -list); do
            echo "$model"
            # Size, not just a 200: a truncated or half-uploaded object answers
            # a HEAD perfectly well and then fails the digest check on use.
            while IFS=$'\t' read -r key size; do
              # -L and the tail: an origin may redirect large files to a CDN,
              # as the hub does, and then two sets of headers come back.
              got=$(curl -fsSIL --max-time 30 "$ORIGIN/$key" \
                | awk 'tolower($1) == "content-length:" { print $2 }' | tail -1 | tr -d '\r') || got=""
              if [ "$got" = "$size" ]; then
                echo "  ok      $key"
              else
                echo "  MISSING $key"
                echo "::error::$ORIGIN/$key is not served as $size bytes (got ${got:-no response})"
                missing=$((missing + 1))
              fi
            done < <("$alcatraz" models pins -model "$model" | jq -r '.files[] | [.key, .size] | @tsv')
          done

          if [ "$missing" -ne 0 ]; then
            echo "::error::$missing file(s) are pinned but not mirrored. Run the \"Mirror model\" workflow before merging."
            exit 1
          fi

          # The current/ alias has its own consumers — image builds that curl it
          # instead of running the downloader — so a pin landing without a
          # republish breaks them the same way, just somewhere else.
          echo
          echo "current/"
          served="$RUNNER_TEMP/served-checksums.txt"
          if ! curl -fsSL --max-time 30 "$ORIGIN/current/checksums.txt" -o "$served"; then
            echo "::error::$ORIGIN/current/checksums.txt is not served. Run the \"Mirror model\" workflow before merging."
            exit 1
          fi

          # Both directions, because the manifest is a closed list: a line
          # missing means a pin landed without a republish, an extra one means
          # the alias still offers something no longer pinned, and a consumer
          # fetches every line it finds either way. Sorted, so neither side
          # depends on the order the other happened to write.
          expected="$RUNNER_TEMP/expected-checksums.txt"
          : >"$expected"
          for model in $("$alcatraz" models pins -list); do
            dir="$(echo "$model" | tr '/' '_')"
            "$alcatraz" models pins -model "$model" \
              | jq -r --arg d "$dir" '.files[] | "\(.sha256)  \($d)/\(.name)"' >>"$expected"
          done

          if diff -u --label pinned --label served <(sort "$expected") <(sort "$served"); then
            echo "  ok      $(grep -c . "$expected") file(s)"
          else
            echo "::error::the current/ alias does not match the pin table. Run the \"Mirror model\" workflow before merging."
            exit 1
          fi
